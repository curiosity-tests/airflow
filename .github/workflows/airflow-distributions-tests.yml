name: Non-core Distribution tests
on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      chalk_on:
        description: "racecar: instrumented arm switch, passed down by the caller"
        type: string
        default: "false"
      profile:
        description: CrashOverride chalk profile
        type: string
        default: curiosity-tests-racecar
      # Static inputs defined to choose which distribution to test to run
      runners:
        description: "The array of labels (in json form) determining runners."
        required: true
        type: string
      platform:
        description: "Platform for the build - 'linux/amd64' or 'linux/arm64'"
        required: true
        type: string
      distribution-name:
        description: "The name of the distribution to test"
        required: true
        type: string
      distribution-cmd-format:
        description: "The type of distribution to test"  # eg prepare-task-sdk-distributions
        required: true
        type: string
      test-type:
        description: "distribution test type"  # eg task-sdk-tests
        required: true
        type: string
      default-python-version:
        description: "Which version of python should be used by default"
        required: true
        type: string
      python-versions:
        description: "JSON-formatted array of Python versions to build images from"
        required: true
        type: string
      use-uv:
        description: "Whether to use uv to build the image (true/false)"
        required: true
        type: string
      canary-run:
        description: "Whether this is a canary run (true/false)"
        required: true
        type: string
      use-local-venv:
        description: "Whether local venv should be used for tests (true/false)"
        required: true
        type: string
      test-timeout:
        required: false
        type: number
        default: 60

permissions:
  contents: read
  id-token: write
env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.chalk_on }}

jobs:
  distributions-tests:
    timeout-minutes: ${{ fromJSON(inputs.test-timeout) }}
    name: ${{ inputs.distribution-name }}:P${{ matrix.python-version }} tests
    runs-on: ${{ fromJSON(inputs.runners) }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        python-version: "${{fromJSON(inputs.python-versions)}}"
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_USERNAME: ${{ github.actor }}
      INCLUDE_NOT_READY_PROVIDERS: "true"
      PYTHON_MAJOR_MINOR_VERSION: "${{ inputs.default-python-version }}"
      VERBOSE: "true"
    steps:
    - name: "Cleanup repo"
      shell: bash
      run: sudo rm -rf ${GITHUB_WORKSPACE}/*
    - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
      uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        persist-credentials: false
    - name: "Prepare breeze & CI image: ${{ matrix.python-version }}"
      uses: ./.github/actions/prepare_breeze_and_image
      with:
        platform: ${{ inputs.platform }}
        python: ${{ matrix.python-version }}
        use-uv: ${{ inputs.use-uv }}
        make-mnt-writeable-and-cleanup: true
      if: ${{ inputs.use-local-venv != 'true' }}
    - name: "Install Breeze"
      uses: ./.github/actions/breeze
      if: ${{ inputs.use-local-venv == 'true' }}
    - name: "Cleanup dist files"
      run: rm -fv ./dist/*
      if: ${{ matrix.python-version == inputs.default-python-version }}
      # Conditional steps based on the distribution name
    - name: "Prepare Airflow ${{inputs.distribution-name}}: wheel"
      env:
        DISTRIBUTION_TYPE: "${{ inputs.distribution-cmd-format }}"
        USE_LOCAL_HATCH: "${{ inputs.use-local-venv }}"
        # Pin on virtualenv is temporary for pypa/hatch#2193
      run: |
        uv tool uninstall hatch || true
        uv tool install hatch==1.16.5
        breeze release-management "${DISTRIBUTION_TYPE}" --distribution-format wheel
      if: ${{ matrix.python-version == inputs.default-python-version }}
    - name: "Verify wheel packages with twine"
      run: |
        uv tool uninstall twine || true
        uv tool install twine && twine check dist/*.whl
      if: ${{ matrix.python-version == inputs.default-python-version }}
    - name: >
        Run unit tests for Airflow ${{inputs.distribution-name}}:Python ${{ matrix.python-version }}
      env:
        PYTHON_VERSION: "${{ matrix.python-version }}"
        TEST_TYPE: "${{ inputs.test-type }}"
      run: >
        breeze testing "${TEST_TYPE}" --python "${PYTHON_VERSION}"
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
