
name: UI End-to-End Tests

permissions:
  contents: read
  id-token: write
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      workflow-name:
        description: "Name of the test"
        type: string
        required: true
      runners:
        description: "The array of labels (in json form) determining runners."
        type: string
        default: '["ubuntu-24.04"]'
      platform:
        description: "Platform for the build - 'linux/amd64' or 'linux/arm64'"
        type: string
        default: 'linux/amd64'
      default-python-version:
        description: "Which version of python should be used by default"
        type: string
        default: '3.10'
      use-uv:
        description: "Whether to use uv to build the image (true/false)"
        type: string
        default: 'true'
      docker-image-tag:
        description: "Tag of the Docker image to test"
        type: string
        required: true
      browser:
        description: "Browser to test (chromium, firefox, webkit, all)"
        type: string
        default: "all"

  workflow_call:
    inputs:
      chalk_on:
        description: "racecar: instrumented arm switch, passed down by the caller"
        type: string
        default: "false"
      profile:
        description: CrashOverride chalk profile
        type: string
        default: curiosity-tests-racecar
      workflow-name:
        description: "Name of the test"
        type: string
        required: true
      runners:
        description: "The array of labels (in json form) determining runners."
        required: true
        type: string
      platform:
        description: "Platform for the build - 'linux/amd64' or 'linux/arm64'"
        required: true
        type: string
      default-python-version:
        description: "Which version of python should be used by default"
        required: true
        type: string
      use-uv:
        description: "Whether to use uv to build the image (true/false)"
        required: true
        type: string
      docker-image-tag:
        description: "Tag of the Docker image to test"
        type: string
        default: ""
      browser:
        description: "Browser to test (chromium, firefox, webkit, all)"
        type: string
        default: "all"

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.chalk_on }}

jobs:
  test-ui-e2e-tests:
    timeout-minutes: 90
    name: ${{ inputs.workflow-name || 'UI E2E Tests' }}
    runs-on: ${{ fromJSON(inputs.runners || '["ubuntu-24.04"]') }}
    env:
      PYTHON_MAJOR_MINOR_VERSION: "${{ inputs.default-python-version || '3.10' }}"
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_USERNAME: ${{ github.actor }}
      VERBOSE: "true"
      BROWSER: "${{ inputs.browser || 'all' }}"
      PLATFORM: "${{ inputs.platform || 'linux/amd64' }}"
      USE_UV: "${{ inputs.use-uv || 'true' }}"
    steps:
    - name: "Cleanup repo"
      shell: bash
      run: sudo rm -rf ${GITHUB_WORKSPACE}/*
    - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
      uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        fetch-depth: 2
        persist-credentials: false
    - name: "Prepare breeze & PROD image: ${{ env.PYTHON_MAJOR_MINOR_VERSION }}"
      uses: ./.github/actions/prepare_breeze_and_image
      with:
        platform: ${{ inputs.platform }}
        image-type: "prod"
        python: ${{ env.PYTHON_MAJOR_MINOR_VERSION }}
        use-uv: ${{ inputs.use-uv }}
        make-mnt-writeable-and-cleanup: true
      id: breeze
      if: github.event_name != 'workflow_dispatch'
    - name: "Install Breeze (manual trigger)"
      uses: ./.github/actions/breeze
      if: github.event_name == 'workflow_dispatch'
    - name: "Setup pnpm"
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86    # v6.0.10
      with:
        version: 9
        run_install: false
    - name: "Setup node"
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020    # v7.0.0
      with:
        node-version: 24
    - name: "Compile UI assets (for image build fallback)"
      if: github.event_name == 'workflow_dispatch'
      run: |
        cd airflow-core/src/airflow/ui
        pnpm install --frozen-lockfile
        pnpm build
        cd ../api_fastapi/auth/managers/simple/ui
        pnpm install --frozen-lockfile
        pnpm build
    - name: "Install Playwright browsers and dependencies"
      run: |
        cd airflow-core/src/airflow/ui
        pnpm install --frozen-lockfile
        pnpm exec playwright install --with-deps
    - name: "Test UI e2e tests"
      run: breeze testing ui-e2e-tests --browser "$BROWSER"
      env:
        DOCKER_IMAGE: "${{ inputs.docker-image-tag || '' }}"
    - name: "Upload test results"
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a    # v7.0.1
      with:
        name: "playwright-report-${{ env.BROWSER }}"
        path: |
          airflow-core/src/airflow/ui/playwright-report/
          airflow-core/src/airflow/ui/test-results/
        retention-days: 7
        if-no-files-found: 'warn'
      if: always()
    - name: "Extract E2E test failures and fixme tests"
      run: python3 scripts/ci/extract_e2e_test_results.py
      env:
        RESULTS_JSON: "airflow-core/src/airflow/ui/test-results/results.json"
        OUTPUT_DIR: "e2e-test-report"
        BROWSER: "${{ env.BROWSER }}"
        RUN_ID: "${{ github.run_id }}"
        RUN_ATTEMPT: "${{ github.run_attempt }}"
      if: always()
    - name: "Upload E2E test report"
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a    # v7.0.1
      with:
        name: "e2e-test-report-${{ env.BROWSER }}"
        path: e2e-test-report/
        retention-days: 14
        if-no-files-found: 'warn'
      if: always()
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
