name: Additional PROD image tests
on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      chalk_on:
        description: "racecar: instrumented arm switch, passed down by the caller"
        type: string
        default: "false"
      profile:
        description: CrashOverride chalk profile
        type: string
        default: curiosity-tests-racecar
      runners:
        description: "The array of labels (in json form) determining runners."
        required: true
        type: string
      platform:
        description: "Platform for the build - 'linux/amd64' or 'linux/arm64'"
        required: true
        type: string
      default-branch:
        description: "The default branch for the repository"
        required: true
        type: string
      run-task-sdk-integration-tests:
        description: "Whether to run Task SDK integration tests (true/false)"
        required: true
        type: string
      run-remote-logging-s3-e2e-tests:
        description: "Whether to run S3 remote logging e2e tests (true/false)"
        required: true
        type: string
      run-remote-logging-elasticsearch-e2e-tests:
        description: "Whether to run Elasticsearch remote logging e2e tests (true/false)"
        required: true
        type: string
      run-remote-logging-opensearch-e2e-tests:
        description: "Whether to run OpenSearch remote logging e2e tests (true/false)"
        required: true
        type: string
      run-event-driven-e2e-tests:
        description: "Whether to run event driven e2e tests (true/false)"
        required: true
        type: string
      run-java-sdk-e2e-tests:
        description: "Whether to run Java SDK e2e tests (true/false)"
        required: true
        type: string
      java-sdk-version:
        description: "JDK version used to build the Java SDK bundles natively in the e2e tests"
        required: true
        type: string
      run-go-sdk-e2e-tests:
        description: "Whether to run Go SDK e2e tests (true/false)"
        required: true
        type: string
      run-openlineage-e2e-tests:
        description: "Whether to run OpenLineage e2e tests (true/false)"
        required: true
        type: string
      run-openlineage-e2e-compat-tests:
        description: "Whether to run the OpenLineage older-Airflow compat matrix (true/false)"
        required: true
        type: string
      run-ts-sdk-e2e-tests:
        description: "Whether to run TypeScript SDK e2e tests (true/false)"
        required: true
        type: string
      providers-compatibility-tests-matrix:
        description: "JSON matrix of released Airflow versions for the OpenLineage e2e compat tests."
        required: true
        type: string
      constraints-branch:
        description: "Branch used to construct constraints URL from."
        required: true
        type: string
      upgrade-to-newer-dependencies:
        description: "Whether to upgrade to newer dependencies (true/false)"
        required: true
        type: string
      docker-cache:
        description: "Docker cache specification to build the image (registry, local, disabled)."
        required: true
        type: string
      disable-airflow-repo-cache:
        description: "Disable airflow repo cache read from main."
        required: true
        type: string
      canary-run:
        description: "Whether to run the canary run (true/false)"
        required: true
        type: string
      default-python-version:
        description: "Which version of python should be used by default"
        required: true
        type: string
      use-uv:
        description: "Whether to use uv"
        required: true
        type: string
      run-ui-e2e-tests:
        description: "Whether to run UI e2e tests (true/false)"
        required: true
        type: string
      run-airflow-ctl-integration-tests:
        description: "Whether to run Airflow CTL integration tests (true/false)"
        required: true
        type: string
permissions:
  contents: read
  id-token: write
env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.chalk_on }}

jobs:
  prod-image-extra-checks-main:
    name: PROD image extra checks (main)
    uses: ./.github/workflows/prod-image-extra-checks.yml
    with:
      runners: ${{ inputs.runners }}
      platform: ${{ inputs.platform }}
      python-versions: "[ '${{ inputs.default-python-version }}' ]"
      default-python-version: "${{ inputs.default-python-version }}"
      branch: ${{ inputs.default-branch }}
      upgrade-to-newer-dependencies: ${{ inputs.upgrade-to-newer-dependencies }}
      constraints-branch: ${{ inputs.constraints-branch }}
      docker-cache: ${{ inputs.docker-cache }}
      disable-airflow-repo-cache: ${{ inputs.disable-airflow-repo-cache }}
    if: inputs.default-branch == 'main' && inputs.canary-run == 'true'

  prod-image-extra-checks-release-branch:
    name: PROD image extra checks (release)
    uses: ./.github/workflows/prod-image-extra-checks.yml
    with:
      runners: ${{ inputs.runners }}
      platform: ${{ inputs.platform }}
      python-versions: "[ '${{ inputs.default-python-version }}' ]"
      default-python-version: "${{ inputs.default-python-version }}"
      branch: ${{ inputs.default-branch }}
      upgrade-to-newer-dependencies: ${{ inputs.upgrade-to-newer-dependencies }}
      constraints-branch: ${{ inputs.constraints-branch }}
      docker-cache: ${{ inputs.docker-cache }}
      disable-airflow-repo-cache: ${{ inputs.disable-airflow-repo-cache }}
    if: inputs.default-branch != 'main' && inputs.canary-run == 'true'

  test-examples-of-prod-image-building:
    timeout-minutes: 60
    name: "Test examples of PROD image building"
    runs-on: ${{ fromJSON(inputs.runners) }}
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_USERNAME: ${{ github.actor }}
      VERBOSE: "true"
    steps:
    - name: "Cleanup repo"
      shell: bash
      run: sudo rm -rf ${GITHUB_WORKSPACE}/*
    - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
      uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        fetch-depth: 2
        persist-credentials: false
    - name: "Prepare breeze & PROD image: ${{ inputs.default-python-version }}"
      uses: ./.github/actions/prepare_breeze_and_image
      with:
        platform: ${{ inputs.platform }}
        image-type: "prod"
        python: "${{ inputs.default-python-version }}"
        use-uv: ${{ inputs.use-uv }}
        make-mnt-writeable-and-cleanup: true
    - name: "Test examples of PROD image building"
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
        DEFAULT_BRANCH: ${{ inputs.default-branch }}
        DEFAULT_PYTHON_VERSION: "${{ inputs.default-python-version }}"
      run: " cd ./docker-tests && TEST_IMAGE=\"ghcr.io/$GITHUB_REPOSITORY/$DEFAULT_BRANCH/prod/python$DEFAULT_PYTHON_VERSION\" uv run pytest tests/docker_tests/test_examples_of_prod_image_building.py -n auto --color=yes"

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  test-docker-compose-quick-start:
    timeout-minutes: 60
    name: "Docker Compose quick start with PROD image verifying"
    runs-on: ${{ fromJSON(inputs.runners) }}
    env:
      PYTHON_MAJOR_MINOR_VERSION: "${{ inputs.default-python-version }}"
