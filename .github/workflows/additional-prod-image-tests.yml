            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
    if: inputs.run-task-sdk-integration-tests == 'true'

  test-e2e-integration-tests-basic:
    name: "Test e2e integration tests with PROD image"
    uses: ./.github/workflows/airflow-e2e-tests.yml
    with:
      workflow-name: "Regular e2e test"
      runners: ${{ inputs.runners }}
      platform: ${{ inputs.platform }}
      default-python-version: "${{ inputs.default-python-version }}"
      use-uv: ${{ inputs.use-uv }}

  test-e2e-integration-tests-remote-log:
    name: "Remote logging tests with PROD image"
    uses: ./.github/workflows/airflow-e2e-tests.yml
    with:
      workflow-name: "Remote logging e2e test"
      runners: ${{ inputs.runners }}
      platform: ${{ inputs.platform }}
      default-python-version: "${{ inputs.default-python-version }}"
      use-uv: ${{ inputs.use-uv }}
      e2e_test_mode: "remote_log"
    if: inputs.canary-run == 'true' || inputs.run-remote-logging-s3-e2e-tests == 'true'

  test-e2e-integration-tests-remote-log-elasticsearch:
    name: "Elasticsearch remote logging tests with PROD image"
    uses: ./.github/workflows/airflow-e2e-tests.yml
    with:
      workflow-name: "Elasticsearch remote logging e2e test"
      runners: ${{ inputs.runners }}
      platform: ${{ inputs.platform }}
      default-python-version: "${{ inputs.default-python-version }}"
      use-uv: ${{ inputs.use-uv }}
      e2e_test_mode: "remote_log_elasticsearch"
    if: inputs.canary-run == 'true' || inputs.run-remote-logging-elasticsearch-e2e-tests == 'true'

  test-e2e-integration-tests-remote-log-opensearch:
    name: "OpenSearch remote logging tests with PROD image"
    uses: ./.github/workflows/airflow-e2e-tests.yml
    with:
      workflow-name: "OpenSearch remote logging e2e test"
      runners: ${{ inputs.runners }}
      platform: ${{ inputs.platform }}
      default-python-version: "${{ inputs.default-python-version }}"
      use-uv: ${{ inputs.use-uv }}
      e2e_test_mode: "remote_log_opensearch"
    if: inputs.canary-run == 'true' || inputs.run-remote-logging-opensearch-e2e-tests == 'true'

  test-e2e-integration-tests-xcom-object-storage:
    name: "XCom object storage backend tests with PROD image"
    uses: ./.github/workflows/airflow-e2e-tests.yml
    with:
      workflow-name: "XCom object storage backend e2e test"
      runners: ${{ inputs.runners }}
      platform: ${{ inputs.platform }}
      default-python-version: "${{ inputs.default-python-version }}"
      use-uv: ${{ inputs.use-uv }}
      e2e_test_mode: "xcom_object_storage"

  test-e2e-integration-tests-event-driven:
    name: "Event driven tests with PROD image"
    uses: ./.github/workflows/airflow-e2e-tests.yml
    with:
      workflow-name: "Event driven e2e test"
      runners: ${{ inputs.runners }}
      platform: ${{ inputs.platform }}
      default-python-version: "${{ inputs.default-python-version }}"
      use-uv: ${{ inputs.use-uv }}
      e2e_test_mode: "event_driven"
    if: inputs.canary-run == 'true' || inputs.run-event-driven-e2e-tests == 'true'

  test-e2e-integration-tests-java-sdk:
    name: "Java SDK e2e tests with PROD image"
    uses: ./.github/workflows/airflow-e2e-tests.yml
    with:
      workflow-name: "Java SDK e2e test"
      runners: ${{ inputs.runners }}
      platform: ${{ inputs.platform }}
      default-python-version: "${{ inputs.default-python-version }}"
      use-uv: ${{ inputs.use-uv }}
      e2e_test_mode: "java_sdk"
      java-sdk-version: "${{ inputs.java-sdk-version }}"
    if: inputs.canary-run == 'true' || inputs.run-java-sdk-e2e-tests == 'true'
  test-e2e-integration-tests-go-sdk:
    name: "Go SDK e2e tests with PROD image"
    uses: ./.github/workflows/airflow-e2e-tests.yml
    with:
      workflow-name: "Go SDK e2e test"
      runners: ${{ inputs.runners }}
      platform: ${{ inputs.platform }}
      default-python-version: "${{ inputs.default-python-version }}"
      use-uv: ${{ inputs.use-uv }}
      e2e_test_mode: "go_sdk"
    if: inputs.canary-run == 'true' || inputs.run-go-sdk-e2e-tests == 'true'

  test-e2e-integration-tests-ts-sdk:
    name: "TypeScript SDK e2e tests with PROD image"
    uses: ./.github/workflows/airflow-e2e-tests.yml
    with:
      workflow-name: "TypeScript SDK e2e test"
      runners: ${{ inputs.runners }}
      platform: ${{ inputs.platform }}
      default-python-version: "${{ inputs.default-python-version }}"
      use-uv: ${{ inputs.use-uv }}
      e2e_test_mode: "ts_sdk"
    if: inputs.canary-run == 'true' || inputs.run-ts-sdk-e2e-tests == 'true'

  test-e2e-integration-tests-openlineage:
    name: "OpenLineage e2e tests with PROD image"
    uses: ./.github/workflows/airflow-e2e-tests.yml
    with:
      workflow-name: "OpenLineage e2e test"
      runners: ${{ inputs.runners }}
      platform: ${{ inputs.platform }}
      default-python-version: "${{ inputs.default-python-version }}"
      use-uv: ${{ inputs.use-uv }}
      e2e_test_mode: "openlineage"
    if: inputs.canary-run == 'true' || inputs.run-openlineage-e2e-tests == 'true'

  # Older-Airflow compatibility: costly, so it does not run on every OpenLineage PR — only on canary
  # (scheduled / main) or when a maintainer sets the "full tests needed" label (both folded into the
  # run-openlineage-e2e-compat-tests selective-check output). PRs otherwise run the PROD job only.
  test-e2e-integration-tests-openlineage-compat:
    name: "OpenLineage e2e compat tests with PROD image"
    strategy:
      fail-fast: false
      matrix:
        compat: ${{ fromJSON(inputs.providers-compatibility-tests-matrix) }}
    uses: ./.github/workflows/openlineage-e2e-compat-tests.yml
    with:
      runners: ${{ inputs.runners }}
      platform: ${{ inputs.platform }}
      default-python-version: "${{ inputs.default-python-version }}"
      use-uv: ${{ inputs.use-uv }}
      airflow-version: ${{ matrix.compat.airflow-version }}
    if: inputs.run-openlineage-e2e-compat-tests == 'true'

  test-ui-e2e-chromium:
    name: "Chromium UI e2e tests with PROD image"
    uses: ./.github/workflows/ui-e2e-tests.yml
    with:
      workflow-name: "Chromium UI e2e tests"
      runners: ${{ inputs.runners }}
      platform: ${{ inputs.platform }}
      default-python-version: "${{ inputs.default-python-version }}"
      use-uv: ${{ inputs.use-uv }}
      browser: "chromium"
    if: inputs.run-ui-e2e-tests == 'true'

  test-ui-e2e-firefox:
    name: "Firefox UI e2e tests with PROD image"
    uses: ./.github/workflows/ui-e2e-tests.yml
    with:
      workflow-name: "Firefox UI e2e tests"
      runners: ${{ inputs.runners }}
      platform: ${{ inputs.platform }}
      default-python-version: "${{ inputs.default-python-version }}"
      use-uv: ${{ inputs.use-uv }}
      browser: "firefox"
    if: inputs.run-ui-e2e-tests == 'true'

  test-ui-e2e-webkit:
    name: "WebKit UI e2e tests with PROD image"
    uses: ./.github/workflows/ui-e2e-tests.yml
    with:
      workflow-name: "WebKit UI e2e tests"
      runners: ${{ inputs.runners }}
      platform: ${{ inputs.platform }}
      default-python-version: "${{ inputs.default-python-version }}"
      use-uv: ${{ inputs.use-uv }}
      browser: "webkit"
    if: inputs.run-ui-e2e-tests == 'true'

  airflow-ctl-integration-tests:
    timeout-minutes: 60
    name: "Airflow CTL integration tests with PROD image"
    runs-on: ${{ fromJSON(inputs.runners) }}
    env:
      PYTHON_MAJOR_MINOR_VERSION: "${{ inputs.default-python-version }}"
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_USERNAME: ${{ github.actor }}
      VERBOSE: "true"
    steps:
    - name: "Cleanup repo"
      shell: bash
      run: sudo rm -rf ${GITHUB_WORKSPACE}/*
    - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
      uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        fetch-depth: 2
        persist-credentials: false
    - name: "Prepare breeze & PROD image: ${{ env.PYTHON_MAJOR_MINOR_VERSION }}"
      uses: ./.github/actions/prepare_breeze_and_image
      with:
        platform: ${{ inputs.platform }}
        image-type: "prod"
        python: ${{ env.PYTHON_MAJOR_MINOR_VERSION }}
        use-uv: ${{ inputs.use-uv }}
        make-mnt-writeable-and-cleanup: true
      id: breeze
    - name: "Run airflowctl integration tests"
      run: breeze testing airflow-ctl-integration-tests
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
    if: inputs.run-airflow-ctl-integration-tests == 'true'
